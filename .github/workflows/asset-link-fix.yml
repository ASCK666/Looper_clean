name: Asset link fix

on:
  push:
    branches:
      - feat/beat-crate-digger
    paths:
      - .github/workflows/asset-link-fix.yml

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beat-crate-digger
      - name: Point skin picture to clean assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old_desktop = 'assets/looper-ui/looper66-desktop-pitch-clean-1e6d4f36.webp'
          new_desktop = 'assets/looper-ui/looper66-desktop-pitch-clean-no-crate-7907d094.webp'
          old_mobile = 'assets/looper-ui/looper66-mobile-pitch-clean-c034fcbb.webp'
          new_mobile = 'assets/looper-ui/looper66-mobile-pitch-clean-no-crate-933411c6.webp'
          assert text.count(old_desktop) == 1
          assert text.count(old_mobile) == 1
          text = text.replace(old_desktop, new_desktop).replace(old_mobile, new_mobile)
          p.write_text(text)
          PY
      - name: Commit link update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(looper): use crate-free skin assets"
          git push origin HEAD:feat/beat-crate-digger
