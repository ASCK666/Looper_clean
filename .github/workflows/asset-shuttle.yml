name: Asset shuttle

on:
  push:
    branches:
      - feat/beat-crate-digger
    paths:
      - .github/workflows/asset-shuttle.yml

permissions:
  contents: write

jobs:
  clean-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beat-crate-digger
      - name: Install image tools
        run: python -m pip install pillow numpy
      - name: Remove only baked Beat Crate artwork
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          import numpy as np
          from pathlib import Path
          import hashlib, math

          root = Path('.')
          css_path = root / 'css' / 'looper.css'
          desktop_old = root / 'assets' / 'looper-ui' / 'looper66-desktop-pitch-clean-1e6d4f36.webp'
          mobile_old = root / 'assets' / 'looper-ui' / 'looper66-mobile-pitch-clean-c034fcbb.webp'

          def tiled_texture(src, target_w, target_h, strips, overlap):
              src = src.resize((target_w, src.height), Image.Resampling.BICUBIC)
              usable_h = max(1, math.ceil((target_h + overlap * (strips - 1)) / strips))
              pieces = []
              for i in range(strips):
                  piece = src
                  if i % 2:
                      piece = ImageOps.mirror(piece)
                  if i % 3 == 2:
                      piece = ImageOps.flip(piece)
                  pieces.append(piece.resize((target_w, usable_h), Image.Resampling.BICUBIC))
              canvas = Image.new('RGB', (target_w, target_h))
              y = 0
              for i, piece in enumerate(pieces):
                  if i == 0:
                      h = min(piece.height, target_h)
                      canvas.paste(piece.crop((0, 0, target_w, h)), (0, 0))
                      y = h
                      continue
                  if y >= target_h:
                      break
                  ov = min(overlap, y, piece.height, target_h - y + overlap)
                  start = max(0, y - ov)
                  remaining = min(piece.height, target_h - start)
                  base = np.array(canvas.crop((0, start, target_w, start + remaining))).astype(np.float32)
                  incoming = np.array(piece.crop((0, 0, target_w, remaining))).astype(np.float32)
                  alpha = np.ones((remaining, 1, 1), np.float32)
                  if ov:
                      alpha[:ov, 0, 0] = np.linspace(0, 1, ov, endpoint=True)
                  mixed = (base * (1 - alpha) + incoming * alpha).clip(0, 255).astype(np.uint8)
                  canvas.paste(Image.fromarray(mixed), (0, start))
                  y = start + remaining
              return canvas

          def clean_asset(path, sample_box, target_box, strips, overlap, stem):
              original = Image.open(path).convert('RGB')
              result = original.copy()
              sample = original.crop(sample_box)
              x0, y0, x1, y1 = target_box
              texture = tiled_texture(sample, x1 - x0, y1 - y0, strips, overlap)
              result.paste(texture, (x0, y0))

              # Verify all pixels outside the Beat Crate mask are untouched.
              a = np.array(original)
              b = np.array(result)
              mask = np.ones(a.shape[:2], dtype=bool)
              mask[y0:y1, x0:x1] = False
              assert np.array_equal(a[mask], b[mask]), f'pixels changed outside crate mask: {path}'

              tmp = path.with_name(stem + '.webp')
              result.save(tmp, 'WEBP', lossless=True, method=6)
              digest = hashlib.sha256(tmp.read_bytes()).hexdigest()[:8]
              final = path.with_name(f'{stem}-{digest}.webp')
              tmp.replace(final)
              return final

          desktop_new = clean_asset(
              desktop_old,
              (52, 410, 1034, 530),
              (30, 570, 1056, 960),
              4,
              24,
              'looper66-desktop-pitch-clean-no-crate',
          )
          mobile_new = clean_asset(
              mobile_old,
              (40, 430, 401, 600),
              (37, 773, 404, 849),
              2,
              14,
              'looper66-mobile-pitch-clean-no-crate',
          )

          css = css_path.read_text()
          css = css.replace(desktop_old.name, desktop_new.name)
          css = css.replace(mobile_old.name, mobile_new.name)
          css_path.write_text(css)

          desktop_old.unlink()
          mobile_old.unlink()
          print('desktop:', desktop_new)
          print('mobile:', mobile_new)
          PY
      - name: Commit clean assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/looper-ui css/looper.css
          git commit -m "refactor(assets): remove baked Beat Crate artwork"
          git push origin HEAD:feat/beat-crate-digger
