name: Beat import dedupe fix

on:
  push:
    branches: [feat/beat-crate-digger]
    paths: [.github/workflows/import-dedupe-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beat-crate-digger

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply import dedupe fix
        run: python tools/apply_import_dedupe_fix.py

      - name: Focused unit and contract checks
        run: |
          node tests/core_unit.js
          python tests/looper66_contract.py
          git diff --check

      - name: Browser regression
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/looper.js js/events.js tests/core_unit.js tests/browser_smoke.py
          git commit -m "fix(looper): dedupe repeated beat imports"
          git push origin HEAD:feat/beat-crate-digger
