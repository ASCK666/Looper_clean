name: Beat Crate browser smoke
on:
  push:
    branches: [feat/beat-crate-digger]
    paths: [.github/workflows/crate-browser-smoke.yml]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beat-crate-digger
      - name: Stop deck shell intercepting Beat Crate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('css/looper.css')
          css=p.read_text()
          start=css.index('.looper66Shell .cassetteDeck {')
          end=css.index('}',start)+1
          rule=css[start:end]
          assert 'pointer-events:auto' in rule,rule
          fixed=rule.replace('pointer-events:auto','pointer-events:none',1)
          p.write_text(css[:start]+fixed+css[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/looper.css
          git commit -m "fix(looper): let Beat Crate receive pointer events"
          git push origin HEAD:feat/beat-crate-digger
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify crate playback in Chromium
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py
