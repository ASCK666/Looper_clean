name: Bootstrap clean repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone clean source snapshot
        run: |
          git clone --depth 1 --branch clean-200826 https://github.com/ASCK666/Looper666.git "$RUNNER_TEMP/source"
          rm -rf "$RUNNER_TEMP/source/.git"

      - name: Replace main with clean root commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan clean-main
          git rm -rf .
          git clean -fdx
          cp -a "$RUNNER_TEMP/source/." .
          git add --all
          git commit -m "Initial clean baseline from Looper666 clean-200826"
          git branch -M main
          git push --force origin main
