name: Project checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Locate installed Chromium
        run: python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print('CHROMIUM=' + p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"

      - name: Run maintained checks
        run: python tools/test_all.py

      - name: Upload render screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: looper-render
          path: test-artifacts/*.png
          if-no-files-found: ignore
