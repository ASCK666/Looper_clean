name: Beat Crate HTML fix

on:
  push:
    branches:
      - feat/beat-crate-digger
    paths:
      - .github/workflows/crate-html-fix.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beat-crate-digger
      - name: Apply Beat Crate patch
        run: |
          python tools/apply_crate_html_fix.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/looper66_contract.py')
          text=p.read_text()
          text=text.replace("crate=HTML[HTML.index('<section class=\"panel beatCratePanel\">'):]", "crate=HTML[HTML.index('<section class=\"panel beatCratePanel\"'):]")
          p.write_text(text)

          p=Path('css/looper.css')
          css=p.read_text()
          anchor='#looper .crateFlag[aria-pressed="true"] { border-color:#b86d17;color:#ffe0a2;background:#321d05; }\n'
          assert anchor in css
          css=css.replace(anchor,anchor+'#looper .crateFavorite { font-size:13px; }\n',1)
          p.write_text(css)

          p=Path('tests/validate.py')
          text=p.read_text()
          text=text.replace('assets/looper-ui/looper66-desktop-pitch-clean-1e6d4f36.webp','assets/looper-ui/looper66-desktop-pitch-clean-no-crate-7907d094.webp')
          text=text.replace('assets/looper-ui/looper66-mobile-pitch-clean-c034fcbb.webp','assets/looper-ui/looper66-mobile-pitch-clean-no-crate-933411c6.webp')
          p.write_text(text)
          PY
      - name: Focused static checks
        run: |
          python -m pip install pillow
          python tests/assets_health.py
          python tests/looper66_contract.py
          python tests/validate.py
          node --check js/looper.js
          node --check js/events.js
          git diff --check
      - name: Commit functional crate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/looper.css js/looper.js js/events.js tests/assets_health.py tests/looper66_contract.py tests/browser_smoke.py tests/validate.py
          git commit -m "fix(looper): make Beat Crate real HTML controls"
          git push origin HEAD:feat/beat-crate-digger
