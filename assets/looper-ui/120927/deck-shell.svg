<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#535554"/>
      <stop offset=".13" stop-color="#494b4a"/>
      <stop offset=".52" stop-color="#3f4140"/>
      <stop offset=".84" stop-color="#454746"/>
      <stop offset="1" stop-color="#383a39"/>
    </linearGradient>
    <linearGradient id="metalEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7d7b" stop-opacity=".72"/>
      <stop offset=".38" stop-color="#393b3a" stop-opacity=".20"/>
      <stop offset="1" stop-color="#0d0f10" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24292b"/>
      <stop offset=".45" stop-color="#1d2224"/>
      <stop offset="1" stop-color="#141819"/>
    </linearGradient>
    <linearGradient id="panelEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#474c4d"/>
      <stop offset=".18" stop-color="#2a2e2f"/>
      <stop offset="1" stop-color="#080a0b"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272b2c"/>
      <stop offset=".48" stop-color="#1d2021"/>
      <stop offset="1" stop-color="#101213"/>
    </linearGradient>
    <pattern id="microHammer" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 4.5 4.5 0 9 4.5 4.5 9Z" fill="none" stroke="#b8bab8" stroke-opacity=".032" stroke-width=".8"/>
      <path d="M0 0 4.5 4.5 9 0M0 9 4.5 4.5 9 9" fill="none" stroke="#060708" stroke-opacity=".055" stroke-width=".7"/>
    </pattern>
    <!-- Reference material is neutral graphite: all procedural noise is explicitly desaturated. -->
    <filter id="graphiteTexture" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".052 .095" numOctaves="3" seed="27" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain"><feFuncA type="linear" slope=".15"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
    </filter>
    <filter id="panelTexture" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .12" numOctaves="2" seed="73" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain"><feFuncA type="linear" slope=".075"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
    </filter>
    <filter id="deckShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>

  <g filter="url(#deckShadow)">
    <rect x="34" y="101" width="1352" height="906" rx="22" fill="url(#metal)" stroke="#111314" stroke-width="7" filter="url(#graphiteTexture)"/>
    <rect x="42" y="108" width="1336" height="891" rx="16" fill="url(#microHammer)" opacity=".86"/>
    <rect x="46" y="112" width="1328" height="883" rx="14" fill="none" stroke="url(#metalEdge)" stroke-width="2"/>
  </g>

  <g fill="#0a0c0d" stroke="#8f918e" stroke-width="2">
