<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086">
  <!-- Self-contained production scene. Source components remain separate assets,
       but are inlined here because browsers sandbox external resources inside an
       SVG used as a CSS background. -->
  <defs>
    <linearGradient id="sceneWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#75401f"/><stop offset=".45" stop-color="#67351b"/><stop offset="1" stop-color="#4d2713"/></linearGradient>
    <pattern id="sceneGrain" width="124" height="28" patternUnits="userSpaceOnUse"><path d="M0 7C24 1 58 15 124 5M0 20C30 11 75 30 124 15" fill="none" stroke="#2b1208" stroke-opacity=".24" stroke-width="2"/><path d="M0 13C32 6 82 19 124 10" fill="none" stroke="#bd713c" stroke-opacity=".12"/></pattern>
    <linearGradient id="sceneLead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#08090a"/><stop offset=".45" stop-color="#242728"/><stop offset="1" stop-color="#070809"/></linearGradient>
    <linearGradient id="sceneMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#45494a"/><stop offset=".48" stop-color="#333738"/><stop offset="1" stop-color="#292c2d"/></linearGradient>
    <linearGradient id="scenePanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#272b2c"/><stop offset="1" stop-color="#171a1b"/></linearGradient>
    <pattern id="sceneDiamond" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 6 6 0l6 6-6 6Z" fill="none" stroke="#929596" stroke-opacity=".11"/></pattern>
    <filter id="sceneShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>

  <rect width="1448" height="1086" fill="url(#sceneWood)"/><rect width="1448" height="1086" fill="url(#sceneGrain)"/>
  <path d="M0 84C260 99 470 64 704 82S1180 100 1448 78" fill="none" stroke="#c17a45" stroke-opacity=".08" stroke-width="3"/>
  <path d="M0 944C242 922 470 963 716 941s456-6 732 3" fill="none" stroke="#231006" stroke-opacity=".18" stroke-width="4"/>

  <!-- One power lead + two XLR-style rear leads. -->
  <g fill="none" stroke="url(#sceneLead)" stroke-linecap="round" stroke-linejoin="round"><path d="M342 104C341 78 341 42 362-8" stroke-width="22"/><path d="M1023 105V32C1023 11 1029-1 1035-8" stroke-width="18"/><path d="M1134 105V32C1134 11 1140-1 1146-8" stroke-width="18"/></g>
  <g fill="#222627" stroke="#08090a" stroke-width="3"><rect x="317" y="51" width="50" height="55" rx="8"/><rect x="1000" y="8" width="48" height="98" rx="7"/><rect x="1111" y="8" width="48" height="98" rx="7"/></g>
  <g fill="#b7afa3" stroke="#393a3a" stroke-width="3"><rect x="1005" y="53" width="38" height="53" rx="3"/><rect x="1116" y="53" width="38" height="53" rx="3"/></g>
  <g stroke="#73706a" stroke-width="2" opacity=".7"><path d="M1011 61h26M1011 70h26M1122 61h26M1122 70h26"/></g>

  <!-- Graphite chassis. -->
  <g filter="url(#sceneShadow)"><rect x="34" y="101" width="1352" height="906" rx="20" fill="url(#sceneMetal)" stroke="#111314" stroke-width="7"/><rect x="42" y="108" width="1336" height="891" rx="15" fill="url(#sceneDiamond)"/><rect x="47" y="113" width="1326" height="881" rx="12" fill="none" stroke="#777a7b" stroke-opacity=".45" stroke-width="2"/></g>
  <g fill="#080a0b" stroke="#a0a1a0" stroke-width="2"><circle cx="58" cy="130" r="10"/><circle cx="1358" cy="130" r="10"/><circle cx="58" cy="979" r="10"/><circle cx="1358" cy="979" r="10"/></g>
  <g stroke="#303334" stroke-width="2"><path d="m54 126 8 8m0-8-8 8M1354 126l8 8m0-8-8 8M54 975l8 8m0-8-8 8M1354 975l8 8m0-8-8 8"/></g>

  <!-- Readout frame. Dynamic amber content is HTML. -->
  <rect x="62" y="145" width="365" height="332" rx="11" fill="url(#scenePanel)" stroke="#0b0d0e" stroke-width="4"/>
  <rect x="76" y="165" width="337" height="292" rx="9" fill="#050503" stroke="#5a5d5e" stroke-width="3"/>
  <rect x="82" y="175" width="323" height="272" rx="6" fill="#040403" stroke="#151515" stroke-width="2"/>
  <g fill="#080a0b" stroke="#9a8b75" stroke-width="2"><circle cx="79" cy="160" r="7"/><circle cx="407" cy="160" r="7"/><circle cx="79" cy="461" r="7"/><circle cx="407" cy="461" r="7"/></g>

  <!-- Volume / MIC / PHONES fixed hardware. -->
  <rect x="62" y="483" width="365" height="113" rx="10" fill="url(#scenePanel)" stroke="#0b0d0e" stroke-width="4"/>
  <g fill="#d5d6d2" font-family="monospace" font-size="20" font-weight="700"><text x="104" y="513">VOLUME</text><text x="245" y="513">MIC</text><text x="336" y="513">PHONES</text></g>
  <g stroke="#c7c8c5" stroke-opacity=".55" stroke-width="2"><path d="M207 508v69M310 508v69"/></g><circle cx="132" cy="551" r="42" fill="none" stroke="#c8c8c3" stroke-width="2" stroke-dasharray="2 8"/>
  <g fill="#08090a" stroke="#8b7f70" stroke-width="4"><circle cx="259" cy="550" r="21"/><circle cx="366" cy="550" r="21"/></g><g fill="#050606"><circle cx="259" cy="550" r="10"/><circle cx="366" cy="550" r="10"/></g>

  <!-- Pitch bed; live range thumb and numeric value overlay it. -->
  <rect x="437" y="137" width="115" height="459" rx="10" fill="url(#sceneMetal)" stroke="#17191a" stroke-width="3"/><text x="468" y="170" fill="#e3e4df" font-family="monospace" font-size="22" font-weight="700">PITCH</text><rect x="482" y="184" width="18" height="288" rx="8" fill="#070808" stroke="#3c3f40" stroke-width="2"/>
  <g stroke="#868988" stroke-opacity=".55"><path d="M461 208h12M461 238h12M461 268h12M461 298h12M461 328h12M461 358h12M461 388h12M461 418h12M461 448h12"/></g>
  <g fill="#d6d7d3" font-family="monospace" font-size="18"><text x="507" y="212">+8</text><text x="527" y="332">0</text><text x="507" y="448">-8</text></g><rect x="451" y="484" width="91" height="47" rx="6" fill="#111414" stroke="#333637" stroke-width="2"/>

  <!-- Reader shell. The door/glass is one separate static foreground asset. -->
  <rect x="565" y="137" width="534" height="441" rx="12" fill="url(#sceneMetal)" stroke="#101213" stroke-width="4"/>
  <g fill="#080a0b" stroke="#9a9c9b" stroke-width="2"><circle cx="586" cy="157" r="8"/><circle cx="1076" cy="157" r="8"/><circle cx="586" cy="458" r="8"/><circle cx="1076" cy="458" r="8"/></g>
  <rect x="594" y="173" width="472" height="302" rx="11" fill="#05090c" stroke="#08090a" stroke-width="7"/><rect x="602" y="181" width="456" height="286" rx="8" fill="#081118" stroke="#2f393f" stroke-width="2"/>

  <!-- Transport recesses only; actual controls are HTML. -->
  <g fill="#101213" stroke="#070809" stroke-width="5"><rect x="583" y="486" width="151" height="94" rx="8"/><rect x="744" y="486" width="140" height="94" rx="8"/><rect x="896" y="486" width="190" height="94" rx="8"/></g>

  <!-- Import panel. -->
  <rect x="1112" y="138" width="244" height="457" rx="12" fill="url(#scenePanel)" stroke="#0b0d0e" stroke-width="4"/><text x="1150" y="178" fill="#e6e6e1" font-family="monospace" font-size="22" font-weight="700">IMPORT SAMPLES</text>
  <rect x="1128" y="198" width="212" height="160" rx="6" fill="#1a1d1e" stroke="#9a9c9c" stroke-width="2" stroke-dasharray="9 6"/><path d="M1208 237h25l10 9h23v31h-58Z" fill="#d9d9d5"/>
  <g fill="#d1d2ce" font-family="monospace" font-size="16" text-anchor="middle"><text x="1234" y="308">DRAG &amp; DROP</text><text x="1234" y="331">AUDIO FILES HERE</text></g>
  <g fill="#111314" stroke="#08090a" stroke-width="3"><rect x="1128" y="374" width="212" height="49" rx="5"/><rect x="1128" y="435" width="212" height="49" rx="5"/></g><path d="M1129 499h210" stroke="#5d6060"/>
  <g fill="#b9bbb7" font-family="monospace" font-size="14"><text x="1140" y="530">SUPPORTED FORMATS</text><text x="1140" y="553">WAV  MP3  FLAC  AIFF</text><text x="1140" y="575">MAX 100MB</text></g>

  <!-- Lower crates / beat-list frames. -->
  <rect x="62" y="612" width="344" height="356" rx="8" fill="#101314" stroke="#07090a" stroke-width="4"/><rect x="408" y="612" width="948" height="356" rx="8" fill="#101314" stroke="#07090a" stroke-width="4"/>
  <rect x="72" y="621" width="324" height="40" fill="#181c1d"/><rect x="423" y="621" width="918" height="40" fill="#181c1d"/>
  <g fill="#e1e2de" font-family="monospace" font-size="24" font-weight="700"><text x="118" y="650">CRATES</text><text x="474" y="650">BEATS</text></g>
  <g fill="none" stroke="#e1e2de" stroke-width="4"><rect x="85" y="635" width="18" height="15" rx="3"/><path d="M89 635v-6a5 5 0 0 1 10 0v6M442 635v19M442 635l16-4v18M458 649a7 5 0 1 1-7-5M442 654a7 5 0 1 1-7-5"/></g>
  <g fill="#bfc1bd" font-family="monospace" font-size="15"><text x="451" y="687">#</text><text x="522" y="687">NAME</text><text x="1183" y="687">LENGTH</text></g><path d="M424 692h916" stroke="#222526"/><rect x="1328" y="692" width="12" height="264" rx="6" fill="#171a1b"/><rect x="1328" y="692" width="12" height="110" rx="6" fill="#636769"/>
</svg>
