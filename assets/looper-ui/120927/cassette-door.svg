<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" viewBox="0 0 540 360">
<defs>
  <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#24282a"/>
    <stop offset=".48" stop-color="#1a1e20"/>
    <stop offset="1" stop-color="#101315"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111820" stop-opacity=".18"/>
    <stop offset=".62" stop-color="#071016" stop-opacity=".24"/>
    <stop offset="1" stop-color="#020609" stop-opacity=".30"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".17"/>
    <stop offset=".36" stop-color="#fff" stop-opacity=".065"/>
    <stop offset=".62" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="66" result="n"/>
    <feColorMatrix in="n" type="matrix" values=".12 0 0 0 0  0 .12 0 0 0  0 0 .12 0 0  0 0 0 .13 0"/>
  </filter>
  <mask id="frameMask">
    <rect width="540" height="360" fill="#000"/>
    <rect x="6" y="6" width="528" height="344" rx="12" fill="#fff"/>
    <rect x="36" y="53" width="467" height="270" rx="11" fill="#000"/>
  </mask>
  <clipPath id="window">
    <rect x="36" y="53" width="467" height="270" rx="11"/>
  </clipPath>
</defs>

<!-- one-piece frame; the window itself is genuinely transparent -->
<rect x="6" y="6" width="528" height="344" rx="12" fill="url(#frame)" mask="url(#frameMask)"/>
<rect x="6" y="6" width="528" height="344" rx="12" fill="#fff" opacity=".12" filter="url(#grain)" mask="url(#frameMask)"/>

<!-- frame edges / plastic-metal retention lip -->
<rect x="6" y="6" width="528" height="344" rx="12" fill="none" stroke="#07090a" stroke-width="3"/>
<rect x="10" y="10" width="520" height="336" rx="10" fill="none" stroke="#666a69" stroke-opacity=".42" stroke-width="2"/>
<rect x="17" y="17" width="506" height="322" rx="9" fill="none" stroke="#0a0c0d" stroke-width="3"/>
<rect x="34" y="51" width="471" height="274" rx="12" fill="none" stroke="#050708" stroke-width="7"/>
<rect x="41" y="58" width="457" height="260" rx="10" fill="none" stroke="#3a4042" stroke-opacity=".62" stroke-width="3"/>
<rect x="47" y="64" width="445" height="248" rx="8" fill="none" stroke="#70777a" stroke-opacity=".28" stroke-width="1.5"/>

<!-- smoked glass: translucent by design, so the live cassette and reel animation remain visible -->
<g clip-path="url(#window)" pointer-events="none">
  <rect x="36" y="53" width="467" height="270" rx="11" fill="url(#glass)"/>
  <path d="M124 53H178L86 323H47Z" fill="url(#shine)"/>
  <path d="M470 53H495L466 323H448Z" fill="#fff" opacity=".025"/>
  <rect x="36" y="53" width="467" height="270" rx="11" fill="#071017" opacity=".075"/>
</g>

<!-- centered latch; no screws, no exposed hinge blocks -->
<path d="M224 8H316L311 34Q310 42 302 42H238Q230 42 229 34Z" fill="#171b1d" stroke="#07090a" stroke-width="3"/>
<path d="M232 12H308L305 29H235Z" fill="#35393a" opacity=".62"/>
</svg>