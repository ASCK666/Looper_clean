<svg xmlns="http://www.w3.org/2000/svg" width="550" height="366" viewBox="0 0 550 366">
<defs>
  <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#243139" stop-opacity=".11"/>
    <stop offset=".5" stop-color="#111b20" stop-opacity=".055"/>
    <stop offset="1" stop-color="#071014" stop-opacity=".10"/>
  </linearGradient>
  <linearGradient id="leftReflection" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".52" stop-color="#fff" stop-opacity=".105"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rightReflection" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".04"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="glassArea"><rect x="18" y="20" width="514" height="326" rx="8"/></clipPath>
</defs>
<!-- Glass only. It extends beneath the existing reader plastic; no added bezel/gasket/seam. -->
<g clip-path="url(#glassArea)">
  <rect x="18" y="20" width="514" height="326" rx="8" fill="url(#smoke)"/>
  <path d="M67 20h58L43 346H18Z" fill="url(#leftReflection)"/>
  <path d="M467 20h31l-49 326h-24Z" fill="url(#rightReflection)"/>
  <path d="M22 43H528" stroke="#fff" stroke-opacity=".018"/>
</g>
<!-- Keep only the small top latch from the approved design. -->
<path d="M232 5h86l-4 25c-1 6-5 9-11 9h-56c-6 0-10-3-11-9Z" fill="#171b1d" stroke="#07090a" stroke-width="3"/>
<path d="M240 10h70l-3 15h-64Z" fill="#555a5a" opacity=".42"/>
</svg>