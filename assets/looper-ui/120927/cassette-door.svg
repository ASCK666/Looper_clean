<svg xmlns="http://www.w3.org/2000/svg" width="550" height="366" viewBox="0 0 550 366">
<defs>
  <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#34393b"/>
    <stop offset=".22" stop-color="#25292b"/>
    <stop offset=".78" stop-color="#171a1b"/>
    <stop offset="1" stop-color="#0d0f10"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#26343a" stop-opacity=".13"/>
    <stop offset=".52" stop-color="#111a1f" stop-opacity=".09"/>
    <stop offset="1" stop-color="#071014" stop-opacity=".15"/>
  </linearGradient>
  <linearGradient id="shineL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".12"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shineR" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".55" stop-color="#fff" stop-opacity=".065"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="outerLip">
    <rect width="550" height="366" fill="#000"/>
    <rect x="4" y="5" width="542" height="356" rx="10" fill="#fff"/>
    <rect x="25" y="27" width="500" height="312" rx="7" fill="#000"/>
  </mask>
  <clipPath id="pane"><rect x="25" y="27" width="500" height="312" rx="7"/></clipPath>
</defs>
<!-- Glass runs all the way underneath the plastic lip: no gasket, seam or inner black frame. -->
<rect x="22" y="24" width="506" height="318" rx="9" fill="url(#glass)"/>
<g clip-path="url(#pane)">
  <path d="M78 27h50L49 339H25Z" fill="url(#shineL)"/>
  <path d="M456 27h37l-55 312h-28Z" fill="url(#shineR)"/>
  <path d="M25 52H525" stroke="#fff" stroke-opacity=".025"/>
</g>
<!-- Single outer plastic support, directly overlapping the glass. -->
<rect x="4" y="5" width="542" height="356" rx="10" fill="url(#plastic)" mask="url(#outerLip)"/>
<rect x="5.5" y="6.5" width="539" height="353" rx="9" fill="none" stroke="#555b5c" stroke-opacity=".42" stroke-width="1.5"/>
<!-- Existing top latch retained. -->
<path d="M232 5h86l-4 25c-1 6-5 9-11 9h-56c-6 0-10-3-11-9Z" fill="#171b1d" stroke="#07090a" stroke-width="3"/>
<path d="M240 10h70l-3 15h-64Z" fill="#555a5a" opacity=".42"/>
</svg>