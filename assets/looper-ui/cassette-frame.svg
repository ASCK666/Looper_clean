<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- One static assembly: opening door + full-size blue-night glass + the
       light perimeter gap. No screws are placed on the glass. -->
  <path fill="#16191b" fill-rule="evenodd" d="M28 18H872V582H28ZM78 62H822V536H78Z"/>
  <!-- Slight opening interstice around the complete door section. -->
  <rect x="30" y="20" width="840" height="560" rx="8" fill="none" stroke="#050607" stroke-width="9"/>
  <rect x="39" y="29" width="822" height="542" rx="7" fill="none" stroke="#5b6062" stroke-width="2" opacity=".7"/>
  <!-- Glass is exactly the inner opening area. -->
  <rect x="79" y="63" width="742" height="472" rx="5" fill="#173047" fill-opacity=".20" stroke="#101a24" stroke-width="4"/>
  <path fill="#b8d7eb" fill-opacity=".11" d="M110 68H196L96 210V125Z"/>
  <path fill="#8fb8d2" fill-opacity=".055" d="M746 531H808L620 318H580Z"/>
  <!-- Minimal lower lip only; no pull handle, vents or decorative hardware. -->
  <path fill="#101214" stroke="#34383a" stroke-width="3" d="M342 538H558V555H342Z"/>
</svg>
